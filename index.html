<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Москва: Бизнес-Империя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
}
.header {
    padding: 20px;
    text-align: center;
}
.balance-label {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 5px;
}
.balance {
    font-size: 36px;
    font-weight: 700;
    color: #fbbf24;
    text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
}
.tap-value {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 5px;
}
.main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}
.tap-button {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fbbf24, #d97706);
    border: none;
    font-size: 80px;
    cursor: pointer;
    box-shadow: 0 0 60px rgba(251, 191, 36, 0.6), inset 0 -10px 30px rgba(0,0,0,0.3);
    transition: transform 0.05s;
    color: #fff;
}
.tap-button:active {
    transform: scale(0.92);
}
.floating {
    position: absolute;
    font-size: 28px;
    font-weight: 700;
    color: #10b981;
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    top: 50%;
    left: 50%;
}
@keyframes floatUp {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -200%) scale(1.2); opacity: 0; }
}
.bottom {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    padding: 10px;
    background: rgba(0,0,0,0.3);
}
.bottom button {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    padding: 12px 5px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
}
.bottom button:active {
    background: rgba(255,255,255,0.2);
}
.bottom .icon {
    font-size: 20px;
}
</style>
</head>
<body>
    <div class="header">
        <div class="balance-label">💰 Баланс</div>
        <div class="balance" id="balance">0 ₽</div>
        <div class="tap-value" id="tapValue">За тап: 1 ₽</div>
    </div>

    <div class="main" id="mainArea">
        <button class="tap-button" id="tapBtn" onclick="tap(event)">💰</button>
    </div>

    <div class="bottom">
        <button onclick="showToast('👤 Профиль — скоро')">
            <span class="icon">👤</span>
            Профиль
        </button>
        <button onclick="showToast('🏪 Бизнесы — скоро')">
            <span class="icon">🏪</span>
            Бизнесы
        </button>
        <button onclick="showToast('🛍 Магазин — скоро')">
            <span class="icon">🛍</span>
            Магазин
        </button>
        <button onclick="showToast('🏆 Топ — скоро')">
            <span class="icon">🏆</span>
            Топ
        </button>
    </div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0f172a');
        tg.setBackgroundColor('#0f172a');
    }

    let balance = parseInt(localStorage.getItem('balance') || '0');
    let tapValue = 1;

    function fmt(n) {
        return n.toLocaleString('ru-RU');
    }

    function updateUI() {
        document.getElementById('balance').textContent = fmt(balance) + ' ₽';
        document.getElementById('tapValue').textContent = 'За тап: ' + fmt(tapValue) + ' ₽';
    }

    function tap(e) {
        balance += tapValue;
        localStorage.setItem('balance', balance);
        updateUI();

        // всплывашка +N
        const main = document.getElementById('mainArea');
        const float = document.createElement('div');
        float.className = 'floating';
        float.textContent = '+' + fmt(tapValue) + ' ₽';

        const rect = main.getBoundingClientRect();
        if (e.touches && e.touches[0]) {
            float.style.left = (e.touches[0].clientX - rect.left) + 'px';
            float.style.top = (e.touches[0].clientY - rect.top) + 'px';
        } else if (e.clientX) {
            float.style.left = (e.clientX - rect.left) + 'px';
            float.style.top = (e.clientY - rect.top) + 'px';
        }

        main.appendChild(float);
        setTimeout(() => float.remove(), 1000);

        // вибрация
        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
        }
    }

    function showToast(text) {
        if (tg && tg.showAlert) {
            tg.showAlert(text);
        } else {
            alert(text);
        }
    }

    updateUI();
</script>
</body>
</html>
